# cargo-deny configuration. Enforces ARCHITECTURE.md, License and dependencies: permissive dependencies only.
# Run locally with `cargo deny check`; CI runs it on every PR.

[graph]
all-features = true

[advisories]
# Every advisory (vulnerability, unmaintained, unsound, yanked) fails the check
# unless explicitly ignored here with a reason.
yanked = "deny"
ignore = [
    # chrono is unmaintained, with no safe upgrade. rmcp's server always
    # enables schemars' chrono04 feature, so we can't drop it ourselves.
    # Remove this when rmcp no longer needs it.
    { id = "RUSTSEC-2026-0543", reason = "chrono comes only through rmcp's server" },
]

[licenses]
# Permissive licenses only. GPL, LGPL and AGPL are never allowed (ARCHITECTURE.md, License and dependencies):
# anything not on this list fails the check.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
confidence-threshold = 0.9
# The allow-list is policy, not an inventory: entries may be unused today.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry a version, so they aren't wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
