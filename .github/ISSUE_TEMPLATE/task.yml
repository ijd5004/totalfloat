name: Task / feature
description: A unit of work small enough for one PR.
labels: ["type:feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters and how it fits the architecture. Link docs and design decisions.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What to build. Name crates, modules, commands.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable checkboxes. An agent should be able to verify each one. For a feature, include proof on real data, run on corpus files or public samples, and the result to expect.
      value: |
        - [ ] 
        - [ ] `just check` passes
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: references
    attributes:
      label: References
      description: 'Docs sections, design decisions, rules, related issues. Add "Blocked by: #n" lines for dependencies.'
