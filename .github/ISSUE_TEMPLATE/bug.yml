name: Bug
description: Something behaves incorrectly.
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The result you expected, and why.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands and a synthetic or anonymized file. Never attach confidential schedules. If the problem only shows in a real file from your own work, say so and we'll arrange a transfer (CONTRIBUTING.md, "Donating schedules").
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TotalFloat version / commit
