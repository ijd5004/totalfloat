name: Dependencies

# Only dependency changes can change the result, apart from new advisories,
# which the weekly run picks up.
on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/deny.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/deny.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
